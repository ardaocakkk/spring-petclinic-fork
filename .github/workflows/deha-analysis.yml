# Deha Code Analysis — GitHub Actions Template (fire-and-forget)
#
# Deha runs LLM-powered analysis server-side; it can take several minutes.
# This workflow does NOT wait for it. The runner only builds, packages and
# uploads the sources, then exits in seconds — no runner minutes are burned
# idling, and the job can never time out waiting on the analysis.
#
# The Deha server reports the result back to GitHub itself as a Check Run on
# the commit ("Deha Analysis ✅ / ❌"). Merges are gated by branch protection,
# not by this workflow's exit code.
#
# ── One-time setup ────────────────────────────────────────────────────────────
#   1. Repo secrets (Settings → Secrets and variables → Actions):
#        DEHA_URL    — your Deha server, e.g. https://deha.example.com
#        DEHA_TOKEN  — copy from the project's CI/CD Integration section in Deha
#
#   2. In the Deha project settings, enable "GitHub Checks" and paste a GitHub
#      token (fine-grained PAT with checks:write, or classic token with repo
#      scope). This is what lets the server post the ✅/❌ status.
#
#   3. To block merges on a failing analysis:
#        Settings → Branches → Branch protection rule →
#        "Require status checks to pass" → select "Deha Analysis".
#
# That's it. No polling, no API key, no project ID.

name: Deha Code Analysis

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  deha-analysis:
    name: Submit to Deha
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ─────────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── 2. Java setup ───────────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      # ── 3. Build & test with JaCoCo ─────────────────────────────────────────
      - name: Build and generate coverage report
        run: mvn verify -q -Dmaven.test.failure.ignore=true -DskipITs=true -Dspring-javaformat.skip=true

      # ── 4. Package sources into a zip ───────────────────────────────────────
      - name: Package source files
        run: |
          find src/main/java -name "*.java" > /tmp/java-files.txt
          zip -@ deha-sources.zip < /tmp/java-files.txt
          echo "Packaged $(wc -l < /tmp/java-files.txt) Java files ($(du -sh deha-sources.zip | cut -f1))"

      # ── 5. Submit to Deha and exit (fire-and-forget) ────────────────────────
      - name: Submit analysis to Deha
        env:
          DEHA_URL:    ${{ secrets.DEHA_URL }}
          DEHA_TOKEN:  ${{ secrets.DEHA_TOKEN }}
          HEAD_BRANCH: ${{ github.head_ref || github.ref_name }}
          COMMIT_SHA:  ${{ github.event.pull_request.head.sha || github.sha }}
          PR_ID:       ${{ github.event.pull_request.number }}
          PR_URL:      ${{ github.event.pull_request.html_url }}
        run: |
          # Capture the triggering commit's author so Deha can show "who introduced this issue".
          COMMIT_AUTHOR_NAME=$(git log -1 --format='%an' "$COMMIT_SHA" 2>/dev/null || echo "")
          COMMIT_AUTHOR_EMAIL=$(git log -1 --format='%ae' "$COMMIT_SHA" 2>/dev/null || echo "")
          COMMIT_MESSAGE=$(git log -1 --format='%s' "$COMMIT_SHA" 2>/dev/null || echo "")
          COMMIT_AUTHOR_DATE=$(git log -1 --format='%aI' "$COMMIT_SHA" 2>/dev/null || echo "")

          JACOCO_PATH="target/site/jacoco/jacoco.xml"
          JACOCO_ARGS=""
          if [ -f "$JACOCO_PATH" ]; then
            echo "JaCoCo report found — attaching coverage"
            JACOCO_ARGS="-F jacoco=@${JACOCO_PATH};type=application/xml"
          else
            echo "No jacoco.xml found — coverage skipped"
          fi

          PR_ARGS=""
          [ -n "$PR_ID"  ] && PR_ARGS="$PR_ARGS -F pullRequestId=$PR_ID"
          [ -n "$PR_URL" ] && PR_ARGS="$PR_ARGS -F pullRequestUrl=$PR_URL"

          # --max-time covers only the upload; the analysis itself runs async server-side.
          curl \
            --fail-with-body \
            --max-time 120 \
            -s \
            -X POST "$DEHA_URL/api/analysis/scan" \
            -H "Authorization: Bearer $DEHA_TOKEN" \
            -F "branchName=$HEAD_BRANCH" \
            -F "commitHash=$COMMIT_SHA" \
            -F "commitAuthorName=$COMMIT_AUTHOR_NAME" \
            -F "commitAuthorEmail=$COMMIT_AUTHOR_EMAIL" \
            -F "commitMessage=$COMMIT_MESSAGE" \
            -F "commitAuthorDate=$COMMIT_AUTHOR_DATE" \
            -F "sources=@deha-sources.zip;type=application/zip" \
            $JACOCO_ARGS \
            $PR_ARGS \
            -o /tmp/deha-response.json

          echo "Deha response: $(cat /tmp/deha-response.json)"

          ANALYSIS_ID=$(jq -r '.analysisId // empty' /tmp/deha-response.json 2>/dev/null || echo "")
          if [ -z "$ANALYSIS_ID" ] || [ "$ANALYSIS_ID" = "null" ]; then
            echo "::error::Deha did not accept the analysis. Check DEHA_URL is reachable and DEHA_TOKEN is valid."
            exit 1
          fi

          echo "✅ Analysis #$ANALYSIS_ID submitted — Deha will post the result as a commit check."
          echo "   Live report: $DEHA_URL/analysis/$ANALYSIS_ID"
          echo "### 🚀 Deha analysis #$ANALYSIS_ID submitted" >> "$GITHUB_STEP_SUMMARY"
          echo "Deha runs the analysis server-side and reports back as a **Deha Analysis** commit check." >> "$GITHUB_STEP_SUMMARY"
          echo "[View live report]($DEHA_URL/analysis/$ANALYSIS_ID)" >> "$GITHUB_STEP_SUMMARY"