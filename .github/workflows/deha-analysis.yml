# Deha Code Analysis — GitHub Actions Workflow
#
# Setup:
#   1. Go to your repo → Settings → Secrets and variables → Actions
#   2. Add DEHA_URL        e.g. https://deha.example.com
#   3. Add DEHA_API_KEY    the value you set in application.yml deha.api-key
#   4. Add DEHA_PROJECT_ID the numeric project ID from the Deha dashboard
#
# Optional (PR comments):
#   5. GITHUB_TOKEN is provided automatically — no setup needed.
#
# Copy this file to .github/workflows/deha-analysis.yml in your repository.

name: Deha Code Analysis

on:
  pull_request:
    branches: ["main", "master", "develop"]
  push:
    branches: ["main", "master"]

permissions:
  pull-requests: write   # allows posting PR comments
  contents: read

jobs:
  deha-analysis:
    name: Run Deha Analysis
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ─────────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history needed for branch diff

      # ── 2. Java setup ───────────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      # ── 3. Build & test with JaCoCo ─────────────────────────────────────────
      - name: Build and generate coverage report
        run: mvn verify -q -Dmaven.test.failure.ignore=true -DskipITs=true -Dspring-javaformat.skip=true
        # -Dmaven.test.failure.ignore=true  → don't fail the step on red tests;
        #   Deha will report the failures itself.
        # -Dspring-javaformat.skip=true     → skip Spring's formatter validation plugin.

      # ── 4. Encode JaCoCo XML as Base64 ──────────────────────────────────────
      - name: Encode JaCoCo report
        id: jacoco
        run: |
          JACOCO_PATH="target/site/jacoco/jacoco.xml"
          if [ -f "$JACOCO_PATH" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "xml=$(base64 -w 0 "$JACOCO_PATH")" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No jacoco.xml found at $JACOCO_PATH" >&2
          fi

      # ── 5. Trigger Deha analysis ─────────────────────────────────────────────
      - name: Trigger Deha analysis
        id: deha
        env:
          DEHA_URL: ${{ secrets.DEHA_URL }}
          DEHA_API_KEY: ${{ secrets.DEHA_API_KEY }}
          DEHA_PROJECT_ID: ${{ secrets.DEHA_PROJECT_ID }}
          JACOCO_FOUND: ${{ steps.jacoco.outputs.found }}
          JACOCO_XML: ${{ steps.jacoco.outputs.xml }}
          PR_ID: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_BRANCH: ${{ github.head_ref || github.ref_name }}
          BASE_BRANCH: ${{ github.base_ref || 'main' }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          # Build payload
          PAYLOAD=$(jq -n \
            --argjson projectId "$DEHA_PROJECT_ID" \
            --arg branchName "$HEAD_BRANCH" \
            --arg baseBranchName "$BASE_BRANCH" \
            --arg commitHash "$COMMIT_SHA" \
            --arg pullRequestId "${PR_ID:-}" \
            --arg pullRequestUrl "${PR_URL:-}" \
            '{
              projectId: $projectId,
              branchName: $branchName,
              baseBranchName: $baseBranchName,
              commitHash: $commitHash,
              pullRequestId: (if $pullRequestId == "" then null else $pullRequestId end),
              pullRequestUrl: (if $pullRequestUrl == "" then null else $pullRequestUrl end)
            }')

          # Attach JaCoCo XML if available
          if [ "$JACOCO_FOUND" = "true" ]; then
            PAYLOAD=$(echo "$PAYLOAD" | jq --arg xml "$JACOCO_XML" '. + {jacocoXmlBase64: $xml}')
          fi

          # POST to Deha
          RESPONSE=$(curl -sf \
            -X POST "$DEHA_URL/api/analysis/trigger" \
            -H "Content-Type: application/json" \
            -H "X-Api-Key: $DEHA_API_KEY" \
            -d "$PAYLOAD")

          echo "Deha response: $RESPONSE"
          ANALYSIS_ID=$(echo "$RESPONSE" | jq -r '.analysisId')
          echo "analysisId=$ANALYSIS_ID" >> "$GITHUB_OUTPUT"

      # ── 6. Poll until analysis completes ────────────────────────────────────
      - name: Wait for analysis to complete
        id: result
        env:
          DEHA_URL: ${{ secrets.DEHA_URL }}
          DEHA_API_KEY: ${{ secrets.DEHA_API_KEY }}
          ANALYSIS_ID: ${{ steps.deha.outputs.analysisId }}
        run: |
          echo "Polling analysis $ANALYSIS_ID ..."
          for i in $(seq 1 60); do
            RESULT=$(curl -sf \
              -H "X-Api-Key: $DEHA_API_KEY" \
              "$DEHA_URL/api/analysis/$ANALYSIS_ID")

            STATUS=$(echo "$RESULT" | jq -r '.status')
            echo "Attempt $i — status: $STATUS"

            if [ "$STATUS" = "COMPLETED" ] || [ "$STATUS" = "FAILED" ]; then
              echo "result=$RESULT" >> "$GITHUB_OUTPUT"
              echo "status=$STATUS" >> "$GITHUB_OUTPUT"
              echo "criticalCount=$(echo "$RESULT" | jq -r '.criticalCount')" >> "$GITHUB_OUTPUT"
              echo "highCount=$(echo "$RESULT"     | jq -r '.highCount')"     >> "$GITHUB_OUTPUT"
              echo "totalIssues=$(echo "$RESULT"   | jq -r '.totalIssues')"   >> "$GITHUB_OUTPUT"
              echo "lineCoverage=$(echo "$RESULT"  | jq -r '.coverage.lineCoverage // 0')" >> "$GITHUB_OUTPUT"
              break
            fi
            sleep 10
          done

          if [ "$STATUS" != "COMPLETED" ] && [ "$STATUS" != "FAILED" ]; then
            echo "Timed out waiting for Deha analysis." >&2
            exit 1
          fi

      # ── 7. Post PR comment with results ─────────────────────────────────────
      - name: Post analysis summary to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          ANALYSIS_STATUS: ${{ steps.result.outputs.status }}
          CRITICAL_COUNT: ${{ steps.result.outputs.criticalCount }}
          HIGH_COUNT: ${{ steps.result.outputs.highCount }}
          TOTAL_ISSUES: ${{ steps.result.outputs.totalIssues }}
          LINE_COVERAGE: ${{ steps.result.outputs.lineCoverage }}
          ANALYSIS_ID: ${{ steps.deha.outputs.analysisId }}
          DEHA_URL: ${{ secrets.DEHA_URL }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const status      = process.env.ANALYSIS_STATUS;
            const critical    = parseInt(process.env.CRITICAL_COUNT || '0');
            const high        = parseInt(process.env.HIGH_COUNT || '0');
            const total       = parseInt(process.env.TOTAL_ISSUES || '0');
            const coverage    = parseFloat(process.env.LINE_COVERAGE || '0').toFixed(1);
            const analysisId  = process.env.ANALYSIS_ID;
            const dehaUrl     = process.env.DEHA_URL;

            const statusEmoji = status === 'COMPLETED' ? '✅' : '❌';
            const criticalBadge = critical > 0 ? `🔴 **${critical} Critical**` : '';
            const highBadge     = high > 0     ? `🟠 **${high} High**`     : '';

            const body = [
              `## ${statusEmoji} Deha Analysis — ${status}`,
              '',
              `| Metric | Value |`,
              `|--------|-------|`,
              `| Total issues | ${total} |`,
              `| Critical | ${critical} |`,
              `| High | ${high} |`,
              `| Line coverage | ${coverage}% |`,
              '',
              criticalBadge || highBadge
                ? `> ${[criticalBadge, highBadge].filter(Boolean).join('  ')}`
                : '_No critical or high issues found._',
              '',
              `[View full report](${dehaUrl}/analysis/${analysisId})`,
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      # ── 8. Fail the build if critical issues found ───────────────────────────
      - name: Fail on critical issues
        if: steps.result.outputs.criticalCount > 0
        run: |
          echo "::error::Deha found ${{ steps.result.outputs.criticalCount }} critical issue(s). Fix them before merging."
          exit 1
